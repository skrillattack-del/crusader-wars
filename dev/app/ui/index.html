<!doctype html>
<html lang="en" data-skin="ck3">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crusader Wars 2 launcher</title>
<style>
:root{
  --patina-950:#112021; --patina-900:#16292a; --patina-800:#1c3432; --patina-700:#25433e;
  --line:#35564f;
  --verdigris:#72b8a3; --bronze:#b8924f; --bronze-hi:#dcbb7a; --bronze-lo:#7a5e2f;
  --cinnabar:#c8372d; --cinnabar-hi:#df5448;
  --bone:#e8dfcb; --bone-dim:#aca693;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --han:"Noto Serif SC", "Songti SC", "SimSun", serif;
  --r-s:4px; --r-m:10px;
  --accent-dim:rgba(184,146,79,.18);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--patina-900);color:var(--bone);font:16px/1.5 var(--body);
  display:grid;grid-template-rows:auto 1fr auto;min-height:100vh}
:focus-visible{outline:2px solid var(--bronze-hi);outline-offset:2px}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}

/* ---------- header: brand + the two game plaques ----------
   The plaques pick the launcher look (data-skin on <html>) and still work as
   the round-trip tally: they close one notch per finished step and the seal
   lands between them once the round trip is done. */
.top{position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;
  align-items:center;gap:24px;padding:14px 24px;background:var(--patina-950);border-bottom:1px solid var(--line)}
.top>*{position:relative;z-index:1}
.brand{font-family:var(--display);font-size:1.25rem;letter-spacing:.01em;margin:0;white-space:nowrap}
.brand small{display:block;font-family:var(--body);font-size:.8rem;color:var(--bone-dim)}
.brand-mark{display:none}
.plaques{position:relative;justify-self:center;display:flex;align-items:center;gap:6px}
.plaque{display:inline-flex;align-items:center;gap:10px;white-space:nowrap;
  background:linear-gradient(#dcbb7a,#b8924f 55%,#8a6a36);color:var(--patina-900);font-weight:700;
  border:1px solid var(--bronze-lo);border-radius:var(--r-s);padding:8px 16px;
  transition:transform .6s cubic-bezier(.3,.7,.2,1),filter .18s,opacity .18s}
.plaque[aria-pressed="false"]{opacity:.6;filter:saturate(.55)}
.plaque:hover{opacity:1;filter:none}
.plaque-mark{font:700 1.2rem/1 var(--han)}
.seal{position:absolute;left:50%;top:50%;z-index:2;width:44px;height:44px;margin:-22px 0 0 -22px;
  display:grid;place-items:center;border-radius:4px;background:var(--cinnabar);border:1.5px solid #8e2019;
  color:var(--bone);font:700 26px/1 var(--han);pointer-events:none;
  opacity:0;transform:scale(1.6) rotate(-8deg);
  transition:opacity .25s ease-out .45s, transform .35s cubic-bezier(.2,1.4,.4,1) .45s}
.seal.on{opacity:1;transform:scale(1) rotate(-4deg)}
.stepline{font-size:.9rem;color:var(--bone-dim);text-align:right;white-space:nowrap}
.stepline b{color:var(--bone);font-weight:700}

/* ---------- body ---------- */
.frame{display:grid;grid-template-columns:240px 1fr;min-height:0}
.rail{border-right:1px solid var(--line);padding:20px 12px;background:var(--patina-900)}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rail button{width:100%;display:grid;grid-template-columns:28px 1fr;align-items:center;gap:10px;
  text-align:left;background:none;border:0;color:var(--bone-dim);padding:10px;border-radius:var(--r-s)}
.rail button .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  border:1.5px solid var(--line);font-size:.85rem}
.rail button[data-state="done"] .n{border-color:var(--verdigris);color:var(--verdigris)}
.rail button[data-state="current"]{background:var(--patina-800);color:var(--bone)}
.rail button[data-state="current"] .n{border-color:var(--bronze);background:var(--bronze);color:var(--patina-950)}
.rail button[data-state="locked"]{opacity:.5}

main{padding:28px 36px 40px;overflow:auto}
main:focus{outline:none} /* focused by go() for screen readers, not keyboard travel */
main h2{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.15;margin:0 0 6px}
.lede{color:var(--bone-dim);margin:0 0 24px;max-width:62ch}
.panel{background:var(--patina-800);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 20px}
.stack{display:grid;gap:16px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px;align-items:center}

.btn-primary{background:var(--cinnabar);color:var(--bone);border:1px solid #8e2019;
  padding:11px 20px;border-radius:var(--r-s);font-weight:700}
.btn-primary:hover:not(:disabled){background:var(--cinnabar-hi)}
.btn-quiet{background:transparent;color:var(--bronze-hi);border:1px solid var(--bronze-lo);
  padding:10px 16px;border-radius:var(--r-s)}
.btn-quiet:hover:not(:disabled){border-color:var(--bronze-hi)}

/* setup */
.paths{display:grid;gap:10px}
.pathrow{display:grid;grid-template-columns:22px 180px 1fr auto;gap:12px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line)}
.pathrow:last-child{border-bottom:0}
.pathrow code{font-family:Consolas, "Cascadia Mono", monospace;font-size:.82rem;color:var(--bone-dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--verdigris)}
.dot.bad{background:var(--cinnabar)}
.notice{border-left:3px solid var(--cinnabar);padding:10px 14px;background:rgba(200,55,45,.1);border-radius:0 var(--r-s) var(--r-s) 0}
.notice.ok{border-left-color:var(--verdigris);background:rgba(114,184,163,.08)}

/* encounter */
.faceoff{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:stretch}
.side h3{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0}
.side .role{color:var(--bone-dim);font-size:.9rem;margin:0 0 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0}
.kv dt{color:var(--bone-dim)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.vs{display:grid;place-items:center;font-family:var(--display);color:var(--bronze);font-size:1.4rem}
.ratio{margin-top:20px}
.ratio .bar{display:flex;height:14px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.ratio .a{background:var(--bronze)} .ratio .b{background:var(--verdigris)}
.ratio p{margin:8px 0 0;color:var(--bone-dim);font-size:.92rem}

/* roster */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tiers{display:grid;gap:6px;margin:12px 0 16px}
.tier{display:grid;grid-template-columns:70px 1fr 46px;gap:10px;align-items:center;font-size:.88rem}
.tier .track{height:10px;background:var(--patina-950);border-radius:5px;overflow:hidden}
.tier .fill{height:100%;background:var(--bronze)}
.tier span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--bone-dim)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:.92rem}
th{color:var(--bone-dim);font-weight:400}
td.num,th.num{text-align:right}
.seedrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seedrow input{background:var(--patina-950);color:var(--bone);border:1px solid var(--line);border-radius:var(--r-s);
  padding:8px 10px;font:inherit;width:140px;font-variant-numeric:tabular-nums}
.progress{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.progress li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center;color:var(--bone-dim)}
.progress li[data-s="done"]{color:var(--bone)}
.progress li[data-s="done"] .dot{background:var(--verdigris)}
.progress li[data-s="run"] .dot{background:var(--bronze);animation:pulse 1s infinite alternate}
.progress li[data-s="wait"] .dot{background:var(--line)}
@keyframes pulse{to{opacity:.35}}

.general{padding:12px 0;border-top:1px solid var(--line)}
.general table{table-layout:fixed}
.general td:nth-child(2){width:88px} .general td:nth-child(3){width:44px}
.gname{margin:0 0 6px} .gname span{color:var(--bone-dim);font-size:.88rem;margin-left:6px}
.stackbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-bottom:6px;background:var(--patina-950)}
.t0{background:#4f6f67} .t1{background:var(--verdigris)} .t2{background:var(--bronze)} .t3{background:var(--bronze-hi)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--bone-dim);font-size:.85rem;margin:0 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* write-back */
.diff td.before{color:var(--bone-dim);text-decoration:line-through}
.diff td.after{color:var(--verdigris)}
.formula{font-family:var(--display);font-size:1.05rem;color:var(--bronze-hi);margin:6px 0 0}

/* friendly screens */
.panel-title{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:0 0 10px}
.muted{color:var(--bone-dim)}
.yours{color:var(--verdigris)}
.checklist{list-style:none;margin:0;display:grid}
.checklist li{display:grid;grid-template-columns:14px 1fr auto;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.checklist li:last-child{border-bottom:0}
.dot.warn{background:var(--bronze)}
.btn-sm{padding:6px 12px;font-size:.9rem;white-space:nowrap}
.howto{margin:0;padding-left:22px;display:grid;gap:10px}
.howto.panel{padding-left:40px}
.howto b{color:var(--bronze-hi);font-weight:700}
details.more{margin-top:22px;color:var(--bone-dim)}
details.more summary{cursor:pointer;margin-bottom:10px}
.battles{list-style:none;margin:0 0 20px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.battles button,.seg button{width:100%;text-align:left;background:var(--patina-800);border:1px solid var(--line);
  color:var(--bone);border-radius:var(--r-m);padding:12px 14px;display:grid;gap:2px}
.battles button[aria-pressed="true"],.seg button[aria-pressed="true"]{border-color:var(--bronze);box-shadow:inset 0 0 0 1px var(--bronze)}
.battles b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.battles small,.seg small{color:var(--bone-dim)}
.big{font-family:var(--display);font-size:2.4rem;line-height:1;margin:0 0 4px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px}
.units{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.units li{display:grid;grid-template-columns:1fr auto 36px;gap:10px;font-size:.93rem;align-items:baseline}
.units .num{text-align:right;font-variant-numeric:tabular-nums}
.tier-tag{font-size:.72rem;color:var(--bone-dim);text-transform:uppercase;letter-spacing:.06em}
.banner{border-radius:var(--r-m);padding:18px 22px;margin:0 0 18px;font-family:var(--display);font-size:1.8rem;line-height:1.1}
.banner small{display:block;font-family:var(--body);font-size:.95rem;color:var(--bone-dim);margin-top:4px}
.banner.win{background:rgba(114,184,163,.14);border:1px solid var(--verdigris)}
.banner.loss{background:rgba(200,55,45,.12);border:1px solid var(--cinnabar)}

/* fight: one-button handoff from the prepared pack to the watched result */
.fight-screen{max-width:920px;margin:0 auto}
.fight-screen>.lede{margin-bottom:16px}
.fight-stage{position:relative;overflow:hidden;border:1px solid var(--frame,var(--line));padding:20px 22px 18px;
  background:linear-gradient(90deg,rgba(12,20,22,.98) 0%,rgba(12,20,22,.88) 52%,rgba(12,20,22,.5) 100%),
    url("skins/ck3/panel.jpg") right 38%/55% auto no-repeat,#101719;
  box-shadow:inset 0 0 0 3px var(--patina-950),inset 0 0 0 4px rgba(184,146,79,.24)}
.fight-flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative;z-index:1}
.fight-flow li{position:relative;min-width:0;padding:0 8px;color:var(--bone-dim)}
.fight-flow button{display:grid;grid-template-rows:52px auto auto;justify-items:center;align-content:start;width:100%;
  padding:4px 2px 8px;border:0;border-radius:var(--r-s);background:none;color:inherit;font:inherit;text-align:center;cursor:pointer;
  transition:background .15s}
.fight-flow button:hover .fight-flow-icon{border-color:var(--bronze-hi)}
.fight-flow button[aria-pressed="true"]{background:rgba(184,146,79,.1);box-shadow:inset 0 -2px 0 var(--bronze-hi)}
.fight-flow button:focus-visible{outline:2px solid var(--bronze-hi);outline-offset:2px}
.fight-flow li:not(:last-child)::after{content:"";position:absolute;top:25px;left:calc(50% + 30px);right:calc(-50% + 30px);
  height:1px;background:linear-gradient(90deg,var(--bronze-lo),var(--bronze-hi),var(--bronze-lo));opacity:.65}
.fight-flow li:not(:last-child)::before{content:"";position:absolute;z-index:2;top:22px;right:calc(-50% + 25px);width:7px;height:7px;
  border-top:1px solid var(--bronze-hi);border-right:1px solid var(--bronze-hi);transform:rotate(45deg)}
.fight-flow-icon{position:relative;z-index:3;width:50px;height:50px;display:grid;place-items:center;border-radius:50%;
  color:var(--bone-dim);border:1px solid var(--line);background:rgba(8,14,16,.92);box-shadow:0 0 0 4px rgba(8,14,16,.68)}
.fight-flow-icon svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fight-flow strong{margin-top:9px;color:var(--bone);font-size:.92rem;line-height:1.05;font-weight:600}
.fight-flow small{margin-top:4px;font-size:.72rem;line-height:1.15;color:var(--bone-dim)}
.fight-flow .done .fight-flow-icon{color:var(--verdigris);border-color:var(--verdigris)}
.fight-flow .current .fight-flow-icon{color:var(--patina-950);border-color:var(--bronze-hi);
  background:radial-gradient(circle at 42% 35%,#f1d993,var(--bronze) 64%,#735328);box-shadow:0 0 0 4px rgba(184,146,79,.16),0 0 18px rgba(226,197,127,.28)}
.fight-flow .current strong{color:var(--bronze-hi)}
.fight-flow .pending{opacity:.55}
.fight-flow .pending:has(button[aria-pressed="true"]){opacity:.85}
.fight-detail{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;
  margin-top:14px;padding:12px 16px;border-left:3px solid var(--bronze);background:rgba(8,14,16,.72)}
.fight-detail>div:first-child{flex:1 1 320px}
.fight-detail h3{margin:0 0 4px;font:600 1rem var(--display);color:var(--bronze-hi)}
.fight-detail p{margin:0;color:var(--bone-dim);font-size:.9rem;line-height:1.45}.fight-detail b{color:var(--bone)}
.fight-detail-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.switch{display:inline-flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border:1px solid var(--line);border-radius:999px;
  background:rgba(8,14,16,.6);color:var(--bone-dim);font:600 .82rem var(--body);cursor:pointer}
.switch::before{content:"";width:28px;height:16px;border-radius:999px;background:var(--line);
  box-shadow:inset 2px 0 0 0 var(--bone-dim),inset 14px 0 0 -2px var(--bone-dim);transition:box-shadow .15s,background .15s}
.switch[aria-pressed="true"]{color:var(--bone);border-color:var(--verdigris)}
.switch[aria-pressed="true"]::before{background:var(--verdigris);box-shadow:inset -2px 0 0 0 var(--bone),inset -14px 0 0 -2px var(--bone)}
.fight-matchup{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px 12px;align-items:center;margin:0 0 14px}
.fm-title{grid-column:1/-1;margin:0;font:600 1.05rem var(--display);color:var(--bronze-hi)}
.fm-side{display:grid;gap:2px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--patina-800);
  color:var(--bone);text-align:left;font:inherit;cursor:pointer;transition:border-color .15s}
.fm-side.d{text-align:right}
.fm-side:hover,.fm-side[aria-expanded="true"]{border-color:var(--bronze)}
.fm-role{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--bone-dim)}
.fm-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm-men{font-size:.85rem;color:var(--bone-dim);font-variant-numeric:tabular-nums}
.fm-vs{font:600 1rem var(--display);color:var(--bronze)}
.fm-bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--cinnabar);overflow:hidden}
.fm-bar span{display:block;height:100%;background:var(--verdigris);transition:width .3s}
.fm-units{grid-column:1/-1;list-style:none;margin:0;padding:8px 14px;border:1px solid var(--line);background:rgba(8,14,16,.5);
  display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 18px;font-size:.88rem}
.fm-units li{display:flex;justify-content:space-between;gap:10px}.fm-units .num{font-variant-numeric:tabular-nums;color:var(--bone-dim)}
.fm-units .gen{color:var(--bronze-hi)}.fm-units small{color:var(--bone-dim)}
.fight-status{margin:16px 0 0;padding:4px 16px;list-style:none;border:1px solid var(--line);background:rgba(11,23,24,.86)}
.fight-status li{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(184,146,79,.2)}
.fight-status li:last-child{border-bottom:0}
.fight-status-mark{width:19px;height:19px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);font:700 .72rem/1 var(--body);color:var(--bone-dim)}
.fight-status-mark svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.fight-status .done .fight-status-mark{border-color:var(--verdigris);background:var(--verdigris);color:#102018}
.fight-status .current .fight-status-mark{border:2px solid var(--bronze);border-right-color:transparent;animation:turn 1s linear infinite}
.fight-status .error .fight-status-mark{border-color:var(--cinnabar);background:var(--cinnabar);color:var(--bone)}
.fight-status-copy{display:grid;line-height:1.05}.fight-status-copy strong{font-size:.98rem;font-weight:600}.fight-status-copy small{margin-top:3px;color:var(--bone-dim);font-size:.78rem}
.fight-status-state{font-size:.78rem;color:var(--verdigris);white-space:nowrap}.fight-status .current .fight-status-state{color:var(--bronze-hi)}
.fight-status .pending .fight-status-state{color:var(--bone-dim)}.fight-status .error .fight-status-state{color:#f08c80}
.fight-actions{display:grid;grid-template-columns:minmax(220px,1.2fr) minmax(150px,.72fr) minmax(120px,.58fr);gap:12px;margin-top:16px}
.fight-actions .btn-primary,.fight-actions .btn-quiet{width:100%;min-height:56px;padding-inline:18px}
.fight-actions .btn-primary{font-size:1.35rem}.fight-actions .btn-primary svg{width:25px;height:25px;fill:currentColor;stroke:none}
.fight-actions [data-action="readResult"] svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fight-actions .btn-quiet{font-size:1rem}.fight-actions .btn-quiet svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.battle-guide{margin-top:14px;padding:14px 18px;border-left:3px solid var(--bronze);background:rgba(184,146,79,.08);color:var(--bone-dim);font-size:.9rem}
.battle-guide strong{color:var(--bone)}.battle-guide p{margin:0}.battle-guide p+p{margin-top:6px}
@keyframes turn{to{transform:rotate(360deg)}}

/* activity drawer */
.drawer{border-top:1px solid var(--line);background:var(--patina-950)}
.drawer summary{padding:10px 24px;cursor:pointer;color:var(--bone-dim);display:flex;justify-content:space-between;gap:12px}
.drawer summary label{display:inline-flex;gap:6px;align-items:center;font-size:.85rem}
.log{margin:0;padding:0 24px 14px;max-height:170px;overflow:auto;
  font:12.5px/1.6 Consolas, "Cascadia Mono", monospace;color:var(--bone-dim);white-space:pre-wrap}

/* ---- settings gear button ---- */
.btn-gear{background:none;border:1.5px solid var(--bronze-lo);border-radius:var(--r-s);
  color:var(--bone-dim);padding:7px 10px;display:grid;place-items:center;line-height:1;
  font-size:1.05rem;transition:color .15s,border-color .15s}
.btn-gear:hover:not(:disabled){color:var(--bronze-hi);border-color:var(--bronze-hi)}
.btn-gear svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;display:block}

/* ---- settings modal overlay ---- */
.settings-overlay{position:fixed;inset:0;background:rgba(17,32,33,.78);backdrop-filter:blur(6px);
  display:grid;place-items:center;z-index:9000;opacity:0;pointer-events:none;
  transition:opacity .22s ease}
.settings-overlay.open{opacity:1;pointer-events:all}
.settings-modal{background:var(--patina-900);border:1px solid var(--line);border-radius:14px;
  width:min(540px,93vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 24px 64px rgba(0,0,0,.7);transform:translateY(10px);transition:transform .22s ease}
.settings-overlay.open .settings-modal{transform:translateY(0)}
.settings-head{display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.settings-head h2{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0}
.settings-head p{font-size:.82rem;color:var(--bone-dim);margin:3px 0 0}
.settings-close{background:none;border:none;color:var(--bone-dim);font-size:1.4rem;
  padding:4px 8px;border-radius:var(--r-s);cursor:pointer;line-height:1}
.settings-close:hover{color:var(--bone)}
.settings-body{overflow-y:auto;padding:18px 22px;display:grid;gap:0}
.sfield{display:grid;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.sfield:last-child{border-bottom:0}
.sfield-label{font-size:.9rem;font-weight:600;color:var(--bone)}
.sfield-desc{font-size:.8rem;color:var(--bone-dim)}
/* segmented choice */
.seg-sm{display:flex;flex-wrap:wrap;gap:6px}
.seg-sm button{background:var(--patina-800);border:1px solid var(--line);color:var(--bone-dim);
  padding:6px 14px;border-radius:var(--r-s);font:inherit;font-size:.88rem;cursor:pointer;white-space:nowrap}
.seg-sm button[aria-pressed="true"],.seg-sm-btn[aria-pressed="true"]{background:var(--accent-dim);border-color:var(--bronze);
  color:var(--bronze-hi)}
.seg-sm button:hover:not([aria-pressed="true"]),.seg-sm-btn:hover:not([aria-pressed="true"]){border-color:var(--bone-dim);color:var(--bone)}
.seg-sm-btn{background:var(--patina-800);border:1px solid var(--line);color:var(--bone-dim);
  padding:6px 14px;border-radius:var(--r-s);font:inherit;font-size:.88rem;cursor:pointer;white-space:nowrap}
/* toggle chip */
.toggle-row{display:flex;align-items:center;gap:12px}
.toggle-chip{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle-chip input{opacity:0;width:0;height:0;position:absolute}
.toggle-chip .track{position:absolute;inset:0;border-radius:12px;background:var(--patina-800);
  border:1.5px solid var(--line);transition:background .18s,border-color .18s}
.toggle-chip input:checked+.track{background:var(--verdigris);border-color:var(--verdigris)}
.toggle-chip .thumb{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
  background:var(--bone-dim);transition:transform .18s,background .18s}
.toggle-chip input:checked~.thumb{transform:translateX(20px);background:var(--patina-950)}
/* number spinner */
.num-row{display:flex;align-items:center;gap:10px}
.num-row input[type=number]{background:var(--patina-800);color:var(--bone);border:1px solid var(--line);
  border-radius:var(--r-s);padding:7px 10px;font:inherit;width:100px;font-variant-numeric:tabular-nums;
  appearance:textfield}
.num-row input[type=number]:focus{border-color:var(--bronze-hi);outline:none}
/* settings footer */
.settings-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:12px;
  justify-content:flex-end;align-items:center}
.settings-status{font-size:.82rem;color:var(--verdigris);flex:1}
.settings-status.err{color:var(--cinnabar)}

:root[data-skin="3k"] .rail button[data-state="current"] .n{background:transparent;border:2px solid #f0c7a8;color:#fff1d8;
  box-shadow:0 0 0 2px #b6452f}
:root[data-skin="3k"] .rail button[data-state="done"] .n{border-color:var(--verdigris);color:var(--verdigris)}

:root[data-skin="3k"] main h2{font-weight:700;color:var(--bronze-hi)}
:root[data-skin="3k"] .panel{position:relative;border-radius:0;border:1px solid var(--gold-line);background:#1a3236;
  box-shadow:inset 0 0 0 4px #1a3236,inset 0 0 0 5px rgba(201,164,90,.5)}
:root[data-skin="3k"] .panel.art,:root[data-skin="3k"] .panel.parchment{padding:18px 30px 20px 84px}
:root[data-skin="3k"] .panel.art{background:url("skins/3k/panel.jpg") right bottom/auto 100% no-repeat,#1a3236}
:root[data-skin="3k"] .panel.art::before,:root[data-skin="3k"] .panel.parchment::before{content:"";position:absolute;left:1px;top:1px;
  width:72px;height:88px;background:url("skins/3k/corner.jpg") left top/cover no-repeat}
:root[data-skin="3k"] .checklist li{padding:12px 0;font-size:1.2rem;font-weight:600;border-bottom:0}
:root[data-skin="3k"] .checklist .dot{width:16px;height:16px}
:root[data-skin="3k"] .dot{background:var(--verdigris);box-shadow:0 0 6px rgba(143,220,198,.45)}
:root[data-skin="3k"] .dot.bad{background:#e0634f;box-shadow:0 0 6px rgba(224,99,79,.5)}
:root[data-skin="3k"] .dot.warn{background:var(--bronze-hi)}
:root[data-skin="3k"] .parchment .panel-title{font:700 1.6rem var(--display);color:var(--bronze-hi);margin:4px 0 12px}
:root[data-skin="3k"] .howto{font-size:1.15rem;font-weight:600;line-height:1.45}
:root[data-skin="3k"] .howto b{color:var(--bronze-hi)}
:root[data-skin="3k"] .howto.parchment{padding-left:104px}

:root[data-skin="3k"] .btn-primary{border:2px solid #e0b863;border-radius:6px;padding:12px 28px;color:var(--bronze-hi);font-size:1.2rem;
  background:linear-gradient(rgba(142,52,34,.82),rgba(100,32,22,.92)),url("skins/3k/head.jpg") center/140px}
:root[data-skin="3k"] .btn-primary:hover:not(:disabled){background:linear-gradient(rgba(166,62,40,.85),rgba(118,38,26,.92)),url("skins/3k/head.jpg") center/140px}
:root[data-skin="3k"] .btn-quiet{border:2px solid #e8d59a;border-radius:6px;color:var(--bone);background:#10262b;padding:11px 26px;font-size:1.15rem}
:root[data-skin="3k"] .btn-quiet:hover:not(:disabled){border-color:var(--bronze-hi);color:#fff}
:root[data-skin="3k"] .btn-sm{padding:5px 14px;font-size:.95rem}
:root[data-skin="3k"] details.more summary{font-size:1.2rem;color:var(--bone-dim)}
:root[data-skin="3k"] .drawer{background:#111f22;border-top:1px solid #2c4146}
:root[data-skin="3k"] .drawer summary{font-size:1.1rem;color:var(--bone)}
:root[data-skin="3k"] .settings-modal{border-color:var(--gold-line);border-radius:4px}
:root[data-skin="3k"] .fight-stage{background:linear-gradient(90deg,rgba(15,32,37,.98),rgba(15,32,37,.84) 58%,rgba(15,32,37,.42)),
  url("skins/3k/dragon.jpg") right center/auto 100% no-repeat,#10262b}

@media (max-width: 1060px){
  .stepline{display:none}
  :root[data-skin="ck3"] .plaques::before{display:none}
  :root[data-skin="ck3"] .brand-name{font-size:2.05rem}
  :root[data-skin="ck3"] .plaque,:root[data-skin="3k"] .plaque{padding-inline:22px}
}
@media (max-width: 860px){
  .seg{grid-template-columns:1fr}
  .top{grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;padding:10px 16px}
  .stepline{text-align:left}
  .plaques{grid-column:1/-1;grid-row:2;justify-self:stretch}.plaque{flex:1;justify-content:center}
  .btn-gear{grid-column:2;grid-row:1;justify-self:end}
  :root[data-skin="ck3"] .top,:root[data-skin="3k"] .top{min-height:0}
  :root[data-skin="ck3"] .brand-name{font-size:1.55rem}:root[data-skin="ck3"] .brand-two{width:34px;height:48px;vertical-align:-9px}
  :root[data-skin="ck3"] .brand small{font-size:.9rem}
  .frame{grid-template-columns:minmax(0,1fr)}
  .rail{border-right:0;border-bottom:1px solid var(--line);padding:10px}
  :root[data-skin="ck3"] .rail{background:#070d11;border-right:0;border-bottom:1px solid var(--frame)}
  .rail ol{grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-flow:initial;overflow:visible}
  .rail button,:root[data-skin="ck3"] .rail button,:root[data-skin="3k"] .rail button{grid-template-columns:28px minmax(0,1fr);gap:6px;padding:7px 5px;font-size:.96rem;white-space:nowrap}
  .rail button .n,:root[data-skin="ck3"] .rail button .n,:root[data-skin="3k"] .rail button .n{width:28px;height:28px;font-size:.9rem}
  main{padding:20px}
  .faceoff,.cols{grid-template-columns:1fr}
  .vs{padding:4px 0}
  .pathrow{grid-template-columns:22px 1fr;}
  .pathrow code,.pathrow button{grid-column:2}
  .fight-screen{max-width:none}
  .fight-flow{grid-template-columns:repeat(5,112px);overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
  .fight-flow li:not(:last-child)::after{right:-56px}.fight-flow li:not(:last-child)::before{right:-59px}
  .fight-actions{grid-template-columns:1fr 1fr}.fight-actions .btn-primary{grid-column:1/-1}
}
@media (max-width: 560px){
  .fight-stage{padding-inline:14px}.fight-actions{grid-template-columns:1fr}.fight-actions .btn-primary{grid-column:auto}
  .fight-status li{grid-template-columns:22px 1fr}.fight-status-state{grid-column:2}
  .fight-matchup{grid-template-columns:minmax(0,1fr)}.fm-vs{display:none}.fm-side.d{text-align:left}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>

<header class="top">
  <h1 class="brand"><span class="brand-mark" aria-hidden="true">左</span><span class="brand-name">Crusader Wars <span class="brand-two">2</span></span><small>CK3 battles, fought in Three Kingdoms</small></h1>
  <div class="plaques" role="group" aria-label="Launcher look">
    <button class="plaque" id="halfL" data-action="setSkin" data-skin="ck3" aria-pressed="true"
      title="Crusader Kings III look"><span class="plaque-mark lion" aria-hidden="true">獅</span>Crusader Kings III</button>
    <button class="plaque" id="halfR" data-action="setSkin" data-skin="3k" aria-pressed="false"
      title="Three Kingdoms look"><span class="plaque-mark" aria-hidden="true">東</span>Three Kingdoms</button>
    <span class="seal" id="seal" aria-hidden="true">合</span>
  </div>
  <p class="stepline" id="stepline" aria-live="polite"></p>
  <button class="btn-gear" id="btn-settings" data-action="openSettings" aria-label="Options" title="Options (⚙)">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
</header>

<!-- Settings overlay (JS populates #settings-root) -->
<div class="settings-overlay" id="settings-overlay" role="dialog" aria-modal="true" aria-label="Options">
  <div class="settings-modal">
    <div class="settings-head">
      <div>
        <h2>Options</h2>
        <p>Saved to <code>config/cw2_config.json</code> · rejected keys are blocked by the schema</p>
      </div>
      <button class="settings-close" id="settings-close" data-action="closeSettings" aria-label="Close">✕</button>
    </div>
    <div class="settings-body" id="settings-body">Loading…</div>
    <div class="settings-foot">
      <span class="settings-status" id="settings-status"></span>
      <button class="btn-quiet" id="settings-cancel" data-action="closeSettings">Cancel</button>
      <button class="btn-primary" id="settings-save" data-action="saveSettings">Save</button>
    </div>
  </div>
</div>

<div class="frame">
  <nav class="rail" aria-label="Round-trip steps"><ol id="rail"></ol></nav>
  <main id="main" tabindex="-1"></main>
</div>

<details class="drawer" id="activity-drawer">
  <summary><span>Activity log</span>
    </summary>
  <pre class="log" id="log"></pre>
</details>
<script src="app.js"></script>
</body>
</html>
