<!doctype html>
<html lang="en" data-skin="ck3">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crusader Wars 2 launcher</title>
<style>
:root{
  --patina-950:#112021; --patina-900:#16292a; --patina-800:#1c3432; --patina-700:#25433e;
  --line:#35564f;
  --verdigris:#72b8a3; --bronze:#b8924f; --bronze-hi:#dcbb7a; --bronze-lo:#7a5e2f;
  --cinnabar:#c8372d; --cinnabar-hi:#df5448;
  --bone:#e8dfcb; --bone-dim:#aca693;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --han:"Noto Serif SC", "Songti SC", "SimSun", serif;
  --r-s:4px; --r-m:10px;
  --accent-dim:rgba(184,146,79,.18);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--patina-900);color:var(--bone);font:16px/1.5 var(--body);
  display:grid;grid-template-rows:auto 1fr auto;min-height:100vh}
:focus-visible{outline:2px solid var(--bronze-hi);outline-offset:2px}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}

/* ---------- header: brand + the two game plaques ----------
   The plaques pick the launcher look (data-skin on <html>) and still work as
   the round-trip tally: they close one notch per finished step and the seal
   lands between them once the round trip is done. */
.top{position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;
  align-items:center;gap:24px;padding:14px 24px;background:var(--patina-950);border-bottom:1px solid var(--line)}
.top>*{position:relative;z-index:1}
.brand{font-family:var(--display);font-size:1.25rem;letter-spacing:.01em;margin:0;white-space:nowrap}
.brand small{display:block;font-family:var(--body);font-size:.8rem;color:var(--bone-dim)}
.brand-mark{display:none}
.plaques{position:relative;justify-self:center;display:flex;align-items:center;gap:6px}
.plaque{display:inline-flex;align-items:center;gap:10px;white-space:nowrap;
  background:linear-gradient(#dcbb7a,#b8924f 55%,#8a6a36);color:var(--patina-900);font-weight:700;
  border:1px solid var(--bronze-lo);border-radius:var(--r-s);padding:8px 16px;
  transition:transform .6s cubic-bezier(.3,.7,.2,1),filter .18s,opacity .18s}
.plaque[aria-pressed="false"]{opacity:.6;filter:saturate(.55)}
.plaque:hover{opacity:1;filter:none}
.plaque-mark{font:700 1.2rem/1 var(--han)}
.seal{position:absolute;left:50%;top:50%;z-index:2;width:44px;height:44px;margin:-22px 0 0 -22px;
  display:grid;place-items:center;border-radius:4px;background:var(--cinnabar);border:1.5px solid #8e2019;
  color:var(--bone);font:700 26px/1 var(--han);pointer-events:none;
  opacity:0;transform:scale(1.6) rotate(-8deg);
  transition:opacity .25s ease-out .45s, transform .35s cubic-bezier(.2,1.4,.4,1) .45s}
.seal.on{opacity:1;transform:scale(1) rotate(-4deg)}
.stepline{font-size:.9rem;color:var(--bone-dim);text-align:right;white-space:nowrap}
.stepline b{color:var(--bone);font-weight:700}

/* ---------- body ---------- */
.frame{display:grid;grid-template-columns:240px 1fr;min-height:0}
.rail{border-right:1px solid var(--line);padding:20px 12px;background:var(--patina-900)}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rail button{width:100%;display:grid;grid-template-columns:28px 1fr;align-items:center;gap:10px;
  text-align:left;background:none;border:0;color:var(--bone-dim);padding:10px;border-radius:var(--r-s)}
.rail button .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  border:1.5px solid var(--line);font-size:.85rem}
.rail button[data-state="done"] .n{border-color:var(--verdigris);color:var(--verdigris)}
.rail button[data-state="current"]{background:var(--patina-800);color:var(--bone)}
.rail button[data-state="current"] .n{border-color:var(--bronze);background:var(--bronze);color:var(--patina-950)}
.rail button[data-state="locked"]{opacity:.5}

main{padding:28px 36px 40px;overflow:auto}
main:focus{outline:none} /* focused by go() for screen readers, not keyboard travel */
main h2{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.15;margin:0 0 6px}
.lede{color:var(--bone-dim);margin:0 0 24px;max-width:62ch}
.panel{background:var(--patina-800);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 20px}
.stack{display:grid;gap:16px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px;align-items:center}

.btn-primary{background:var(--cinnabar);color:var(--bone);border:1px solid #8e2019;
  padding:11px 20px;border-radius:var(--r-s);font-weight:700}
.btn-primary:hover:not(:disabled){background:var(--cinnabar-hi)}
.btn-quiet{background:transparent;color:var(--bronze-hi);border:1px solid var(--bronze-lo);
  padding:10px 16px;border-radius:var(--r-s)}
.btn-quiet:hover:not(:disabled){border-color:var(--bronze-hi)}

/* setup */
.paths{display:grid;gap:10px}
.pathrow{display:grid;grid-template-columns:22px 180px 1fr auto;gap:12px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line)}
.pathrow:last-child{border-bottom:0}
.pathrow code{font-family:Consolas, "Cascadia Mono", monospace;font-size:.82rem;color:var(--bone-dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--verdigris)}
.dot.bad{background:var(--cinnabar)}
.notice{border-left:3px solid var(--cinnabar);padding:10px 14px;background:rgba(200,55,45,.1);border-radius:0 var(--r-s) var(--r-s) 0}
.notice.ok{border-left-color:var(--verdigris);background:rgba(114,184,163,.08)}

/* encounter */
.faceoff{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:stretch}
.side h3{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0}
.side .role{color:var(--bone-dim);font-size:.9rem;margin:0 0 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0}
.kv dt{color:var(--bone-dim)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.vs{display:grid;place-items:center;font-family:var(--display);color:var(--bronze);font-size:1.4rem}
.ratio{margin-top:20px}
.ratio .bar{display:flex;height:14px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.ratio .a{background:var(--bronze)} .ratio .b{background:var(--verdigris)}
.ratio p{margin:8px 0 0;color:var(--bone-dim);font-size:.92rem}

/* roster */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tiers{display:grid;gap:6px;margin:12px 0 16px}
.tier{display:grid;grid-template-columns:70px 1fr 46px;gap:10px;align-items:center;font-size:.88rem}
.tier .track{height:10px;background:var(--patina-950);border-radius:5px;overflow:hidden}
.tier .fill{height:100%;background:var(--bronze)}
.tier span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--bone-dim)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:.92rem}
th{color:var(--bone-dim);font-weight:400}
td.num,th.num{text-align:right}
.seedrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seedrow input{background:var(--patina-950);color:var(--bone);border:1px solid var(--line);border-radius:var(--r-s);
  padding:8px 10px;font:inherit;width:140px;font-variant-numeric:tabular-nums}
.progress{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.progress li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center;color:var(--bone-dim)}
.progress li[data-s="done"]{color:var(--bone)}
.progress li[data-s="done"] .dot{background:var(--verdigris)}
.progress li[data-s="run"] .dot{background:var(--bronze);animation:pulse 1s infinite alternate}
.progress li[data-s="wait"] .dot{background:var(--line)}
@keyframes pulse{to{opacity:.35}}

.general{padding:12px 0;border-top:1px solid var(--line)}
.general table{table-layout:fixed}
.general td:nth-child(2){width:88px} .general td:nth-child(3){width:44px}
.gname{margin:0 0 6px} .gname span{color:var(--bone-dim);font-size:.88rem;margin-left:6px}
.stackbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-bottom:6px;background:var(--patina-950)}
.t0{background:#4f6f67} .t1{background:var(--verdigris)} .t2{background:var(--bronze)} .t3{background:var(--bronze-hi)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--bone-dim);font-size:.85rem;margin:0 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* write-back */
.diff td.before{color:var(--bone-dim);text-decoration:line-through}
.diff td.after{color:var(--verdigris)}
.formula{font-family:var(--display);font-size:1.05rem;color:var(--bronze-hi);margin:6px 0 0}

/* friendly screens */
.panel-title{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:0 0 10px}
.muted{color:var(--bone-dim)}
.yours{color:var(--verdigris)}
.checklist{list-style:none;margin:0;display:grid}
.checklist li{display:grid;grid-template-columns:14px 1fr auto;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.checklist li:last-child{border-bottom:0}
.dot.warn{background:var(--bronze)}
.btn-sm{padding:6px 12px;font-size:.9rem;white-space:nowrap}
.howto{margin:0;padding-left:22px;display:grid;gap:10px}
.howto.panel{padding-left:40px}
.howto b{color:var(--bronze-hi);font-weight:700}
details.more{margin-top:22px;color:var(--bone-dim)}
details.more summary{cursor:pointer;margin-bottom:10px}
.battles{list-style:none;margin:0 0 20px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.battles button,.seg button{width:100%;text-align:left;background:var(--patina-800);border:1px solid var(--line);
  color:var(--bone);border-radius:var(--r-m);padding:12px 14px;display:grid;gap:2px}
.battles button[aria-pressed="true"],.seg button[aria-pressed="true"]{border-color:var(--bronze);box-shadow:inset 0 0 0 1px var(--bronze)}
.battles b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.battles small,.seg small{color:var(--bone-dim)}
.big{font-family:var(--display);font-size:2.4rem;line-height:1;margin:0 0 4px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px}
.units{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.units li{display:grid;grid-template-columns:1fr auto 36px;gap:10px;font-size:.93rem;align-items:baseline}
.units .num{text-align:right;font-variant-numeric:tabular-nums}
.tier-tag{font-size:.72rem;color:var(--bone-dim);text-transform:uppercase;letter-spacing:.06em}
.banner{border-radius:var(--r-m);padding:18px 22px;margin:0 0 18px;font-family:var(--display);font-size:1.8rem;line-height:1.1}
.banner small{display:block;font-family:var(--body);font-size:.95rem;color:var(--bone-dim);margin-top:4px}
.banner.win{background:rgba(114,184,163,.14);border:1px solid var(--verdigris)}
.banner.loss{background:rgba(200,55,45,.12);border:1px solid var(--cinnabar)}

/* activity drawer */
.drawer{border-top:1px solid var(--line);background:var(--patina-950)}
.drawer summary{padding:10px 24px;cursor:pointer;color:var(--bone-dim);display:flex;justify-content:space-between;gap:12px}
.drawer summary label{display:inline-flex;gap:6px;align-items:center;font-size:.85rem}
.log{margin:0;padding:0 24px 14px;max-height:170px;overflow:auto;
  font:12.5px/1.6 Consolas, "Cascadia Mono", monospace;color:var(--bone-dim);white-space:pre-wrap}

/* ---- settings gear button ---- */
.btn-gear{background:none;border:1.5px solid var(--bronze-lo);border-radius:var(--r-s);
  color:var(--bone-dim);padding:7px 10px;display:grid;place-items:center;line-height:1;
  font-size:1.05rem;transition:color .15s,border-color .15s}
.btn-gear:hover:not(:disabled){color:var(--bronze-hi);border-color:var(--bronze-hi)}
.btn-gear svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;display:block}

/* ---- settings modal overlay ---- */
.settings-overlay{position:fixed;inset:0;background:rgba(17,32,33,.78);backdrop-filter:blur(6px);
  display:grid;place-items:center;z-index:9000;opacity:0;pointer-events:none;
  transition:opacity .22s ease}
.settings-overlay.open{opacity:1;pointer-events:all}
.settings-modal{background:var(--patina-900);border:1px solid var(--line);border-radius:14px;
  width:min(540px,93vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 24px 64px rgba(0,0,0,.7);transform:translateY(10px);transition:transform .22s ease}
.settings-overlay.open .settings-modal{transform:translateY(0)}
.settings-head{display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.settings-head h2{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0}
.settings-head p{font-size:.82rem;color:var(--bone-dim);margin:3px 0 0}
.settings-close{background:none;border:none;color:var(--bone-dim);font-size:1.4rem;
  padding:4px 8px;border-radius:var(--r-s);cursor:pointer;line-height:1}
.settings-close:hover{color:var(--bone)}
.settings-body{overflow-y:auto;padding:18px 22px;display:grid;gap:0}
.sfield{display:grid;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.sfield:last-child{border-bottom:0}
.sfield-label{font-size:.9rem;font-weight:600;color:var(--bone)}
.sfield-desc{font-size:.8rem;color:var(--bone-dim)}
/* segmented choice */
.seg-sm{display:flex;flex-wrap:wrap;gap:6px}
.seg-sm button{background:var(--patina-800);border:1px solid var(--line);color:var(--bone-dim);
  padding:6px 14px;border-radius:var(--r-s);font:inherit;font-size:.88rem;cursor:pointer;white-space:nowrap}
.seg-sm button[aria-pressed="true"],.seg-sm-btn[aria-pressed="true"]{background:var(--accent-dim);border-color:var(--bronze);
  color:var(--bronze-hi)}
.seg-sm button:hover:not([aria-pressed="true"]),.seg-sm-btn:hover:not([aria-pressed="true"]){border-color:var(--bone-dim);color:var(--bone)}
.seg-sm-btn{background:var(--patina-800);border:1px solid var(--line);color:var(--bone-dim);
  padding:6px 14px;border-radius:var(--r-s);font:inherit;font-size:.88rem;cursor:pointer;white-space:nowrap}
/* toggle chip */
.toggle-row{display:flex;align-items:center;gap:12px}
.toggle-chip{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle-chip input{opacity:0;width:0;height:0;position:absolute}
.toggle-chip .track{position:absolute;inset:0;border-radius:12px;background:var(--patina-800);
  border:1.5px solid var(--line);transition:background .18s,border-color .18s}
.toggle-chip input:checked+.track{background:var(--verdigris);border-color:var(--verdigris)}
.toggle-chip .thumb{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
  background:var(--bone-dim);transition:transform .18s,background .18s}
.toggle-chip input:checked~.thumb{transform:translateX(20px);background:var(--patina-950)}
/* number spinner */
.num-row{display:flex;align-items:center;gap:10px}
.num-row input[type=number]{background:var(--patina-800);color:var(--bone);border:1px solid var(--line);
  border-radius:var(--r-s);padding:7px 10px;font:inherit;width:100px;font-variant-numeric:tabular-nums;
  appearance:textfield}
.num-row input[type=number]:focus{border-color:var(--bronze-hi);outline:none}
/* settings footer */
.settings-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:12px;
  justify-content:flex-end;align-items:center}
.settings-status{font-size:.82rem;color:var(--verdigris);flex:1}
.settings-status.err{color:var(--cinnabar)}

/* =====================================================================
   Skins. Everything above is the shared layout; a skin re-points the
   colour/font tokens and adds its artwork. Art in skins/ is cropped from
   the concept mockups in "docs launcher gui/".
   ===================================================================== */
@font-face{font-family:"Cinzel";src:url("skins/ck3/cinzel.ttf") format("truetype");font-weight:400 900;font-display:swap}
@font-face{font-family:"Crimson Text";src:url("skins/ck3/crimson-regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Crimson Text";src:url("skins/ck3/crimson-semibold.ttf") format("truetype");font-weight:600;font-display:swap}
@font-face{font-family:"Crimson Text";src:url("skins/ck3/crimson-bold.ttf") format("truetype");font-weight:700;font-display:swap}
:root{
  --i-swords:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='14.5 17.5 3 6 3 3 6 3 17.5 14.5'/><line x1='13' x2='19' y1='19' y2='13'/><line x1='16' x2='20' y1='16' y2='20'/><line x1='19' x2='21' y1='21' y2='19'/><polyline points='14.5 6.5 18 3 21 3 21 6 17.5 9.5'/><line x1='5' x2='9' y1='14' y2='18'/><line x1='7' x2='4' y1='17' y2='20'/><line x1='3' x2='5' y1='19' y2='21'/></svg>");
  --i-crown:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z'/><path d='M5 21h14'/></svg>");
  --i-refresh:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8'/><path d='M21 3v5h-5'/><path d='M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16'/><path d='M8 16H3v5'/></svg>");
  --i-list:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'><path d='M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01'/></svg>");
  --brush:polygon(0 14%,4% 0,30% 6%,62% 0,96% 5%,100% 24%,97% 50%,100% 78%,95% 100%,60% 93%,28% 100%,3% 94%,0 70%,2% 42%);
}

/* ---------- Crusader Kings III: blue-black, gold frames, parchment, red brush ---------- */
:root[data-skin="ck3"]{
  --patina-950:#0a0e11; --patina-900:#0e1417; --patina-800:#151a1d; --patina-700:#1f2629;
  --line:#3d3a31;
  --verdigris:#79d57a; --bronze:#b8924f; --bronze-hi:#e2c57f; --bronze-lo:#7a6436;
  --cinnabar:#9b221b; --cinnabar-hi:#b42c22;
  --bone:#ece3cf; --bone-dim:#a7a292;
  --display:"Cinzel", Georgia, serif;
  --body:"Crimson Text", Georgia, "Times New Roman", serif;
  --r-s:2px; --r-m:3px;
  --frame:#6e5b36;
  --ink:#1d130d; --ink-red:#7b1812;
}
:root[data-skin="ck3"] body{font-size:18px;background:radial-gradient(ellipse at 60% 40%,#131a1d,#0a0e11 75%)}
:root[data-skin="ck3"] .top{min-height:112px;padding:16px 28px;border-bottom:3px double var(--frame);
  background:linear-gradient(90deg,#0c1013,#12181b 50%,#171d1f)}
:root[data-skin="ck3"] .top::after{content:"";position:absolute;top:0;right:0;bottom:0;width:300px;
  background:url("skins/ck3/head-right.jpg") right center/cover no-repeat;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%)}
:root[data-skin="ck3"] .brand-name{font:600 2.5rem/1 var(--display);color:#e6cf97;text-shadow:0 2px 3px #000;letter-spacing:.01em}
:root[data-skin="ck3"] .brand-two{display:inline-block;width:46px;height:64px;margin:-18px 0 0 2px;vertical-align:-12px;
  background:url("skins/ck3/two.jpg") center/contain no-repeat;color:transparent;overflow:hidden;
  -webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent);mask-image:radial-gradient(closest-side,#000 72%,transparent)}
:root[data-skin="ck3"] .brand small{font:400 1.12rem var(--body);color:var(--bone);margin-top:6px}
:root[data-skin="ck3"] .plaques::before{content:"";position:absolute;right:100%;top:-34px;bottom:-34px;width:150px;margin-right:4px;
  background:url("skins/ck3/head-left.jpg") center/cover no-repeat;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 75%,transparent);mask-image:linear-gradient(90deg,transparent,#000 30%,#000 75%,transparent)}

<script>
/* Crusader Wars 2 launcher UI. Python side: bridge.py via pywebview js_api.
   Flow: get ready -> choose the CK3 battle -> your armies -> fight in 3K -> result. */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Number(n||0).toLocaleString("en-CA");

/* ---- event bus the Python side pushes into via evaluate_js ---- */
window.cw2 = { handlers:{}, on(t,f){(this.handlers[t]=this.handlers[t]||[]).push(f)},
  emit(t,p){(this.handlers[t]||[]).forEach(f=>f(p)); log(`${t} ${JSON.stringify(p)}`)} };

/* ---- bridge call: {'ok':...} or {'error': msg} -> JS exception ---- */
async function call(method, ...args){
  const r = await window.pywebview.api[method](...args);
  if (r && r.error !== undefined) throw new Error(r.error);
  return r || {};
}
const err = e => (e && (e.message || e)) ? (e.message || String(e)) : String(e);
/* Plain-language versions of the errors a player can actually hit. */
function friendly(m){
  if(/No runtime log/.test(m)) return "No battle has been fought with this pack yet. Finish the battle in Three Kingdoms, then try again.";
  if(/exactly one start/.test(m)) return "This battle was restarted or replayed, so its result can't be used. Send the armies again and fight it once.";
  if(/undetermined/.test(m)) return "Neither side fully broke, so there's no winner yet. Fight until one army routs.";
  if(/Close Three Kingdoms/.test(m)) return "Close Three Kingdoms first, then try again.";
  if(/No \.ck3 saves/.test(m)) return "No CK3 saves found yet. In CK3, open a battle and press the crossed swords (or save by hand), then try again.";
  if(/no battle in progress/.test(m)) return "Your latest save has no battle in progress. Save while your armies are fighting.";
  return m;
}
const fail = e => { const m = err(e); log(`error: ${m}`); return friendly(m); };

/* ---- state ---- */

  {id:"enc",    title:"Choose battle"},

];
const S={view:0, reached:0, sealed:false, busy:false, mode:"records", cw1Hint:false,
  health:null, enc:null, roster:null, install:[], installed:false,
  launched:false, removed:false, result:null, error:null,
  config:null, configPath:null, configSha:null};

function log(msg){const el=document.getElementById("log");
  el.textContent+=`[${new Date().toLocaleTimeString("en-CA",{hour12:false})}] ${msg}\n`;el.scrollTop=el.scrollHeight;}

/* tally gap: closes one notch per finished step */
function setTally(){
  const done=S.sealed?5:S.reached; const g=(5-done)*7;
  document.getElementById("halfL").style.transform=`translateX(${-g}px)`;
  document.getElementById("halfR").style.transform=`translateX(${g}px)`;
  document.getElementById("seal").classList.toggle("on",S.sealed);
  document.getElementById("stepline").innerHTML=`Step <b>${S.view+1}</b> of 5: ${STEPS[S.view].title}`;
}

/* launcher look: the header plaques switch it; the bridge remembers it */
function applySkin(skin){
  document.documentElement.dataset.skin=skin;
  for(const id of ["halfL","halfR"]){const b=document.getElementById(id);
    b.setAttribute("aria-pressed",String(b.dataset.skin===skin));}
}

function renderRail(){
  document.getElementById("rail").innerHTML=STEPS.map((s,i)=>{
    const state=i===S.view?"current":i>S.reached?"locked":"done";
    return `<li><button data-go="${i}" data-state="${state}" ${i>S.reached?"disabled":""}
      aria-current="${i===S.view?"step":"false"}"><span class="n">${i+1}</span>${s.title}</button></li>`;
  }).join("");
}

function render(){
  renderRail(); setTally();
  document.getElementById("main").innerHTML=V[STEPS[S.view].id]();
}
function go(i){S.view=i; S.reached=Math.max(S.reached,i); S.error=null; render(); document.getElementById("main").focus(); armResultWatch();}

/* auto_battle_report: on the Fight step, poll the 3K battle log and advance by
   ourselves; off (or no ledger), the player presses Get the result. */
let resultTimer=null;
function armResultWatch(){
  clearInterval(resultTimer); resultTimer=null;
  if(STEPS[S.view].id!=="battle"||!S.config||S.config.auto_battle_report!==true) return;
  resultTimer=setInterval(pollResult,4000);
}
async function pollResult(){
  if(S.busy||STEPS[S.view].id!=="battle") return;
  try{const r=await call("read_result"); S.result=r;
    log(`result arrived on its own: outcome=${r.player_outcome}`);
    go(4);}
  catch(e){/* the battle is still running; stay on the Fight step */}
}
const errorBox=()=>S.error?`<p class="notice" role="alert" style="margin-top:16px">${esc(S.error)}</p>`:"";
const check=(state,text,fix="")=>`<li><span class="dot ${state}" aria-label="${state==="bad"?"Needs fixing":state==="warn"?"Warning":"Ready"}"></span><span>${text}</span>${fix}</li>`;

/* ---- options panel: edits the ledger through bridge.get_config/save_config ----
   One row per ledger key; cut_3d_voice is formally UNDEFINED (canon, turn-2 §4)
   and deliberately has no row. */
const OPT_FIELDS=[
  {key:"show_mode", label:"Presentation", kind:"seg", options:["dramatic","tactical","minimal"],
   desc:"How the result reads: dramatic adds the CK3 battle name, tactical shows the full table, minimal one line."},
  {key:"army_scale_factor", label:"Army scale", kind:"number",
   desc:"Multiplies both CK3 armies before staging; Three Kingdoms army caps still apply. Above 0, up to 10."},
  {key:"domain_focus", label:"Domain", kind:"seg", options:["wei","shu","wu","custom"],
   desc:"Faction focus for unit rolls: the other factions' unique units drop out. Custom keeps the whole pool."},
  {key:"auto_battle_report", label:"Automatic battle report", kind:"toggle",
   desc:"After the fight, advance to the result by yourself instead of waiting for the button."},
  {key:"enable_tw3k_screenshots", label:"Three Kingdoms screenshots", kind:"toggle",
   desc:"Request battle screenshots into the run folder. Only the request is recorded today; no capture backend yet."},
  {key:"injectivity_strict", label:"Strict unit mapping", kind:"toggle",
   desc:"Treat a non-injective config/slots.registry.json as an error instead of a warning."},
];
let settingsDraft=null;

function settingsOverlay(){return document.getElementById("settings-overlay");}

function setSettingsStatus(message, isErr){
  const el=document.getElementById("settings-status");
  el.textContent=message||"";
  el.classList.toggle("err", !!isErr);
}

/* Read the free-form controls (number, toggles) into the draft; segmented
   buttons write the draft directly. */
function collectSettings(){
  if(!settingsDraft) return;
  const num=document.getElementById("set-army_scale_factor");
  if(num){
    const raw=String(num.value).trim();
    settingsDraft.army_scale_factor=raw===""?null:Number(raw);
  }
  for(const f of OPT_FIELDS) if(f.kind==="toggle")
    settingsDraft[f.key]=!!document.getElementById("set-"+f.key).checked;
}

function renderSettingsBody(){
  document.getElementById("settings-body").innerHTML=OPT_FIELDS.map(f=>{
    const v=settingsDraft[f.key];
    const control=f.kind==="seg"
      ?`<div class="seg-sm">${f.options.map(o=>
          `<button data-action="optSeg" data-key="${f.key}" data-value="${o}" aria-pressed="${v===o}">${o}</button>`).join("")}</div>`
      :f.kind==="number"
      ?`<div class="num-row"><input id="set-${f.key}" type="number" min="0.1" max="10" step="0.1" value="${v}"></div>`
      :`<div class="toggle-row"><span class="toggle-chip"><input id="set-${f.key}" type="checkbox" ${v?"checked":""}><span class="track"></span><span class="thumb"></span></span></div>`;
    return `<div class="sfield"><span class="sfield-label">${f.label}</span>${control}<span class="sfield-desc">${f.desc}</span></div>`;
  }).join("");
}

window.cw2.on("install",p=>{S.install[p.index]={label:p.label,status:p.status}; if(STEPS[S.view].id==="roster") render();});

const A={
  async recheck(){S.error=null;

  async removeCw1(){S.error=null;

          `<p class="notice" role="alert">The options ledger is not available (${esc(r.path||"not found")}). Fix it on disk and press Check again.</p>`;

  async setSkin(b){applySkin(b.dataset.skin);

      log(`options saved: sha256=${r.sha256}`);

      if(r.removed_previous) log(`replaced the previous battle pack (run: ${r.removed_previous})`);
      log(`installed ${r.pack} sha256=${r.sha256}`); log(`run folder: ${r.run}`);}
    catch(e){S.error=fail(e);}
    S.busy=false; render();},
  async toBattle(){go(3);},
  async launch(){
    try{await call("launch_3k"); S.launched=true; log("3K launch requested via Steam");}
    catch(e){S.error=fail(e);} render();},
  async readResult(){S.busy=true;S.error=null;render();
    try{S.result=await call("read_result");
      log(`result outcome=${S.result.player_outcome} source=${S.result.result_source}`);
      S.busy=false; go(4); return;}
    catch(e){S.error=fail(e);}
    S.busy=false; render();},
  async removeProbe(){S.busy=true;S.error=null;render();
    try{const r=await call("remove_probe"); S.removed=true;
      log(`removed ${r.removed}${r.run?" (run: "+r.run+")":""}`);
      await A.recheck();}
    catch(e){S.error=fail(e);}
    S.busy=false; render();},
  async restart(){clearInterval(resultTimer); resultTimer=null;
    Object.assign(S,{view:0,reached:0,sealed:false,roster:null,enc:null,cw1Hint:false,
      install:[],installed:false,launched:false,removed:false,result:null,error:null});
    await A.recheck();},
  /* The CK3 button saved a battle: take it straight to Three Kingdoms, stopping at the first error. */
  async autoFight(sig){log(`CK3 battle button: ${sig.battle} (${sig.save_name})`);
    await A.toEncounter(null,sig.save); if(!S.enc) return;
    await A.toRoster(); if(!S.roster) return;
    await A.install(); if(!S.installed) return;
    go(3); await A.launch();}
};

let watching=false;
async function watch(){
  if(watching||S.busy||S.view!==0) return;
  watching=true;
  try{const sig=await call("poll_battle"); if(sig.save&&!S.busy&&S.view===0) await A.autoFight(sig);}
  catch(e){log(`watch: ${err(e)}`);}
  watching=false;
}

document.addEventListener("click",async ev=>{
  if(ev.target&&ev.target.id==="settings-overlay"){await A.closeSettings(); return;}
  const g=ev.target.closest("[data-go]"); if(g&&!g.disabled){go(+g.dataset.go);return;}
  const b=ev.target.closest("[data-action]"); if(b&&!b.disabled&&A[b.dataset.action]) await A[b.dataset.action](b);
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&settingsOverlay().classList.contains("open")) A.closeSettings();
});

window.addEventListener("pywebviewready",async ()=>{log("Python bridge ready");
  try{applySkin((await call("get_skin")).skin);}catch(e){log(`look: ${err(e)}`);}
  render(); A.recheck(); setInterval(watch,3000);});
log("launcher started; waiting for the Python bridge...");
render();
</script>
</body>
