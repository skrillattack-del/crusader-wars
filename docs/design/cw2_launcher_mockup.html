<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crusader Wars 2 launcher (V1 mockup)</title>
<!-- The shipped app must bundle these fonts locally (no network at runtime). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&text=%E5%B7%A6%E5%8F%B3%E5%90%88&display=swap" rel="stylesheet">
<style>
:root{
  --patina-950:#112021; --patina-900:#16292a; --patina-800:#1c3432; --patina-700:#25433e;
  --line:#35564f;
  --verdigris:#72b8a3; --bronze:#b8924f; --bronze-hi:#dcbb7a; --bronze-lo:#7a5e2f;
  --cinnabar:#c8372d; --cinnabar-hi:#df5448;
  --bone:#e8dfcb; --bone-dim:#aca693;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --han:"Noto Serif SC", "Songti SC", "SimSun", serif;
  --r-s:4px; --r-m:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--patina-900);color:var(--bone);font:16px/1.5 var(--body);
  display:grid;grid-template-rows:auto 1fr auto;min-height:100vh}
:focus-visible{outline:2px solid var(--bronze-hi);outline-offset:2px}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}

/* ---------- header: the tally ---------- */
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;
  padding:14px 24px;background:var(--patina-950);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:1.25rem;letter-spacing:.01em;margin:0;white-space:nowrap}
.brand small{display:block;font-family:var(--body);font-size:.8rem;color:var(--bone-dim)}
.tally{width:100%;max-width:520px;height:auto;justify-self:center;overflow:visible}
.tally .half path{fill:url(#bronze);stroke:var(--bronze-lo);stroke-width:1.5}
.tally .half{transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.tally-lbl{font:700 12px var(--body);fill:var(--patina-900)}
.tally-han{font:700 18px var(--han);fill:var(--patina-900)}
.seal{opacity:0;transform-origin:200px 32px;transform:scale(1.6) rotate(-8deg);
  transition:opacity .25s ease-out .45s, transform .35s cubic-bezier(.2,1.4,.4,1) .45s}
.seal rect{fill:var(--cinnabar);stroke:#8e2019;stroke-width:1.5}
.seal text{font:700 26px var(--han);fill:var(--bone)}
.seal.on{opacity:1;transform:scale(1) rotate(-4deg)}
.stepline{font-size:.9rem;color:var(--bone-dim);text-align:right;white-space:nowrap}
.stepline b{color:var(--bone);font-weight:700}

/* ---------- body ---------- */
.frame{display:grid;grid-template-columns:220px 1fr;min-height:0}
.rail{border-right:1px solid var(--line);padding:20px 12px;background:var(--patina-900)}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rail button{width:100%;display:grid;grid-template-columns:28px 1fr;align-items:center;gap:10px;
  text-align:left;background:none;border:0;color:var(--bone-dim);padding:10px;border-radius:var(--r-s)}
.rail button .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  border:1.5px solid var(--line);font-size:.85rem}
.rail button[data-state="done"] .n{border-color:var(--verdigris);color:var(--verdigris)}
.rail button[data-state="current"]{background:var(--patina-800);color:var(--bone)}
.rail button[data-state="current"] .n{border-color:var(--bronze);background:var(--bronze);color:var(--patina-950)}
.rail button[data-state="locked"]{opacity:.5}

main{padding:28px 36px 40px;overflow:auto}
main h2{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.15;margin:0 0 6px}
.lede{color:var(--bone-dim);margin:0 0 24px;max-width:62ch}
.panel{background:var(--patina-800);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 20px}
.stack{display:grid;gap:16px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px;align-items:center}

.btn-primary{background:var(--cinnabar);color:var(--bone);border:1px solid #8e2019;
  padding:11px 20px;border-radius:var(--r-s);font-weight:700}
.btn-primary:hover:not(:disabled){background:var(--cinnabar-hi)}
.btn-quiet{background:transparent;color:var(--bronze-hi);border:1px solid var(--bronze-lo);
  padding:10px 16px;border-radius:var(--r-s)}
.btn-quiet:hover:not(:disabled){border-color:var(--bronze-hi)}

/* setup */
.paths{display:grid;gap:10px}
.pathrow{display:grid;grid-template-columns:22px 180px 1fr auto;gap:12px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line)}
.pathrow:last-child{border-bottom:0}
.pathrow code{font-family:Consolas, "Cascadia Mono", monospace;font-size:.82rem;color:var(--bone-dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--verdigris)}
.dot.bad{background:var(--cinnabar)}
.notice{border-left:3px solid var(--cinnabar);padding:10px 14px;background:rgba(200,55,45,.1);border-radius:0 var(--r-s) var(--r-s) 0}
.notice.ok{border-left-color:var(--verdigris);background:rgba(114,184,163,.08)}

/* encounter */
.faceoff{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:stretch}
.side h3{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0}
.side .role{color:var(--bone-dim);font-size:.9rem;margin:0 0 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0}
.kv dt{color:var(--bone-dim)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.vs{display:grid;place-items:center;font-family:var(--display);color:var(--bronze);font-size:1.4rem}
.ratio{margin-top:20px}
.ratio .bar{display:flex;height:14px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.ratio .a{background:var(--bronze)} .ratio .b{background:var(--verdigris)}
.ratio p{margin:8px 0 0;color:var(--bone-dim);font-size:.92rem}

/* roster */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tiers{display:grid;gap:6px;margin:12px 0 16px}
.tier{display:grid;grid-template-columns:70px 1fr 46px;gap:10px;align-items:center;font-size:.88rem}
.tier .track{height:10px;background:var(--patina-950);border-radius:5px;overflow:hidden}
.tier .fill{height:100%;background:var(--bronze)}
.tier span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--bone-dim)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:.92rem}
th{color:var(--bone-dim);font-weight:400}
td.num,th.num{text-align:right}
.seedrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seedrow input{background:var(--patina-950);color:var(--bone);border:1px solid var(--line);border-radius:var(--r-s);
  padding:8px 10px;font:inherit;width:140px;font-variant-numeric:tabular-nums}
.progress{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.progress li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center;color:var(--bone-dim)}
.progress li[data-s="done"]{color:var(--bone)}
.progress li[data-s="done"] .dot{background:var(--verdigris)}
.progress li[data-s="run"] .dot{background:var(--bronze);animation:pulse 1s infinite alternate}
.progress li[data-s="wait"] .dot{background:var(--line)}
@keyframes pulse{to{opacity:.35}}

.general{padding:12px 0;border-top:1px solid var(--line)}
.general table{table-layout:fixed}
.general td:nth-child(2){width:88px} .general td:nth-child(3){width:44px}
.gname{margin:0 0 6px} .gname span{color:var(--bone-dim);font-size:.88rem;margin-left:6px}
.stackbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-bottom:6px;background:var(--patina-950)}
.t0{background:#4f6f67} .t1{background:var(--verdigris)} .t2{background:var(--bronze)} .t3{background:var(--bronze-hi)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--bone-dim);font-size:.85rem;margin:0 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* write-back */
.diff td.before{color:var(--bone-dim);text-decoration:line-through}
.diff td.after{color:var(--verdigris)}
.formula{font-family:var(--display);font-size:1.05rem;color:var(--bronze-hi);margin:6px 0 0}

/* evidence drawer */
.drawer{border-top:1px solid var(--line);background:var(--patina-950)}
.drawer summary{padding:10px 24px;cursor:pointer;color:var(--bone-dim);display:flex;justify-content:space-between;gap:12px}
.drawer summary label{display:inline-flex;gap:6px;align-items:center;font-size:.85rem}
.log{margin:0;padding:0 24px 14px;max-height:170px;overflow:auto;
  font:12.5px/1.6 Consolas, "Cascadia Mono", monospace;color:var(--bone-dim);white-space:pre-wrap}

@media (max-width: 860px){
  .top{grid-template-columns:1fr;gap:10px}
  .stepline{text-align:left}
  .frame{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line);padding:10px}
  .rail ol{grid-auto-flow:column;overflow-x:auto}
  .rail button{grid-template-columns:28px auto;white-space:nowrap}
  main{padding:20px}
  .faceoff,.cols{grid-template-columns:1fr}
  .vs{padding:4px 0}
  .pathrow{grid-template-columns:22px 1fr;}
  .pathrow code,.pathrow button{grid-column:2}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>

<header class="top">
  <h1 class="brand">Crusader Wars 2<small>CK3 battles, fought in Three Kingdoms</small></h1>
  <svg class="tally" viewBox="0 0 400 64" role="img" aria-labelledby="tallyTitle tallyDesc">
    <title id="tallyTitle">Round-trip tally</title>
    <desc id="tallyDesc">The two halves close as each step finishes and are sealed when the result save is installed in CK3.</desc>
    <defs>
      <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#dcbb7a"/><stop offset=".55" stop-color="#b8924f"/><stop offset="1" stop-color="#8a6a36"/>
      </linearGradient>
    </defs>
    <g id="halfL" class="half">
      <path d="M20,8 H190 L200,18 L190,28 L200,38 L190,48 L200,56 H20 Q8,56 8,44 V20 Q8,8 20,8 Z"/>
      <text x="22" y="39" class="tally-han">左</text>
      <text x="50" y="37" class="tally-lbl">Crusader Kings III</text>
    </g>
    <g id="halfR" class="half">
      <path d="M190,8 H380 Q392,8 392,20 V44 Q392,56 380,56 H200 L190,48 L200,38 L190,28 L200,18 Z"/>
      <text x="378" y="39" class="tally-han" text-anchor="end">右</text>
      <text x="350" y="37" class="tally-lbl" text-anchor="end">Three Kingdoms</text>
    </g>
    <g id="seal" class="seal" aria-hidden="true">
      <rect x="178" y="10" width="44" height="44" rx="4"/>
      <text x="200" y="42" text-anchor="middle">合</text>
    </g>
  </svg>
  <p class="stepline" id="stepline" aria-live="polite"></p>
</header>

<div class="frame">
  <nav class="rail" aria-label="Round-trip steps"><ol id="rail"></ol></nav>
  <main id="main" tabindex="-1"></main>
</div>

<details class="drawer">
  <summary><span>Evidence log</span>
    <label><input type="checkbox" id="simCk3"> Mockup: pretend CK3 is running</label></summary>
  <pre class="log" id="log"></pre>
</details>

<script>
/* ============================================================
   CW2 launcher V1 mockup.
   Everything below "MockBridge" is replaced by the Python side
   (pywebview js_api). The UI only ever calls api() methods and
   listens to window.cw2.emit(type, payload). See FRONTEND_DESIGN.md.
   ============================================================ */
const wait = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => Number(n).toLocaleString("en-CA");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- roll math (mirrors the Python reference in the spec) ---- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const PRIOR=[0.40,0.30,0.20,0.10], BETA=0.6;
/* 3K army: up to 3 generals, each a unit card leading up to 6 retinue units = 21 cards max.
   Verify against a staged full army before trusting these. */
const MAX_RETINUE=18, PER_GENERAL=6, MAX_GENERALS=3, CAPTAIN_PROWESS=5;
const TIER_NAMES=["Levy","Line","Veteran","Elite"];
/* Placeholder display names. Real keys come from land_units_tables via RPFM (G1 evidence). */
const POOL=[["Levy spear","Levy archers"],["Line ji","Line swords"],
            ["Veteran spear guard","Veteran crossbows"],["Elite heavy cavalry","Elite household guard"]];
function tierProbs(prowess){
  const p=Math.min(Math.max(prowess/20,0),2);
  const w=PRIOR.map((pi,k)=>pi*Math.exp(BETA*p*k)); const s=w.reduce((a,b)=>a+b,0);
  return w.map(x=>x/s);
}
function armyFor(sides){
  const big=Math.max(...sides.map(s=>s.men));
  return sides.map(s=>{
    const retinue=Math.max(1,Math.round(MAX_RETINUE*s.men/big));
    const generals=Math.min(MAX_GENERALS,Math.ceil(retinue/PER_GENERAL));
    return {retinue,generals,cards:retinue+generals};
  });
}
/* General 1 is the CK3 commander; generals 2-3 are the highest-prowess knights,
   topped up with generic captains if the side has too few knights. */
function generalsOf(side,g){
  const knights=[...(side.knights||[])].sort((a,b)=>b.prowess-a.prowess);
  const out=[{...side.commander,role:"Commander"},...knights.map(k=>({...k,role:"Knight"}))].slice(0,g);
  while(out.length<g) out.push({name:"Captain",prowess:CAPTAIN_PROWESS,role:"Captain"});
  return out;
}
function rollUnits(n,probs,rng){
  const counts=new Map();
  for(let i=0;i<n;i++){
    let u=rng(),k=0,acc=probs[0]; while(u>acc&&k<3){k++;acc+=probs[k];}
    const name=POOL[k][Math.floor(rng()*POOL[k].length)];
    const key=k+"|"+name; counts.set(key,(counts.get(key)||0)+1);
  }
  return [...counts].map(([key,n])=>{const[k,name]=key.split("|");return{tier:+k,name,count:n}})
    .sort((a,b)=>b.tier-a.tier||b.count-a.count);
}
/* Each general's own prowess tilts the retinue they lead. */
function rollSide(side,army,rng){
  let left=army.retinue;
  const generals=generalsOf(side,army.generals).map(g=>{
    const n=Math.min(PER_GENERAL,left); left-=n;
    const probs=tierProbs(g.prowess);
    return {...g,retinue:n,probs,units:rollUnits(n,probs,rng)};
  });
  return {cards:army.cards,retinue:army.retinue,generals};
}

/* ---- MockBridge: same method names/shapes as the Python Bridge ---- */
const MockBridge = {
  async get_health(){
    await wait(300);
    const running=document.getElementById("simCk3").checked;
    return {
      ck3_running: running,
      paths:[
        {key:"ck3_exe",  label:"Crusader Kings III", value:"C:\\Program Files (x86)\\Steam\\steamapps\\common\\Crusader Kings III\\binaries\\ck3.exe", ok:true},
        {key:"tk_exe",   label:"Three Kingdoms",     value:"C:\\Program Files (x86)\\Steam\\steamapps\\common\\Total War THREE KINGDOMS\\Three_Kingdoms.exe", ok:true},
        {key:"ck3_saves",label:"CK3 save folder",    value:"%USERPROFILE%\\Documents\\Paradox Interactive\\Crusader Kings III\\save games", ok:true},
        {key:"rpfm_cli", label:"RPFM command line",  value:"dev\\tools\\rpfm\\rpfm_cli.exe", ok:true}
      ]
    };
  },
  async get_encounter(){
    await wait(350);
    return {
      id:"enc-0867-03-14-york", save:"CW2_G2_BEFORE.ck3", date:"867.3.14",
      location:"York", terrain:"Plains",
      sides:[
        {role:"Attacker", name:"Great Heathen Army", commander:{name:"Ivar",prowess:22}, men:8400, levies:6200, maa:2200,
         knights:[{name:"Ubba",prowess:19},{name:"Halfdan",prowess:17},{name:"Sigurd",prowess:11}]},
        {role:"Defender", name:"Northumbria",        commander:{name:"Ælla",prowess:9},  men:5100, levies:4300, maa:800,
         knights:[{name:"Osberht",prowess:12},{name:"Ecgberht",prowess:7}]}
      ]
    };
  },
  async roll_roster(encounter, seed){
    await wait(200);
    const rng=mulberry32(seed>>>0); const armies=armyFor(encounter.sides);
    return {seed, sides:encounter.sides.map((s,i)=>rollSide(s,armies[i],rng))};
  },
  async prepare_and_install(roster){
    const steps=["Write battle pack","Install pack to Three Kingdoms data","Verify pack with RPFM"];
    for(let i=0;i<steps.length;i++){
      window.cw2.emit("install",{index:i,label:steps[i],status:"run"}); await wait(650);
      window.cw2.emit("install",{index:i,label:steps[i],status:"done"});
    }
    return {pack:"cw2_battle.pack", sha256:"9f2c…e41a"};
  },
  async launch_3k(){ await wait(300); return {pid:4242}; },
  async read_result(){
    await wait(500);
    /* Mirrors observed_result.json: no side-indexed winner, only the player's outcome and its source. */
    return {player_side:0, player_outcome:"victory", source:"victory_countdown_fallback", sides:[
      {tk_men:3120, tk_lost:860,  ck3_men:8400, ck3_lost:2315},
      {tk_men:1900, tk_lost:1440, ck3_men:5100, ck3_lost:3865}
    ]};
  },
  async preview_changes(){
    /* = plan_mutations(save_text, result): computes the changes, writes nothing */
    await wait(350);
    return {input_save:"CW2_G2_BEFORE.ck3", input_sha256:"4be1…07c9",
      output_save:"CW2_enc-0867-03-14-york_AFTER.ck3", changes:[
      {path:"armies › 1043 › regiments › 0 › current", before:6200, after:4491},
      {path:"armies › 1043 › regiments › 1 › current", before:2200, after:1594},
      {path:"armies › 2210 › regiments › 0 › current", before:4300, after:1041},
      {path:"armies › 2210 › regiments › 1 › current", before:800,  after:194}
    ]};
  },
  async install_save(){
    /* apply_mutations → run folder → copy into CK3 save games under a NEW name. Never overwrites. */
    await wait(700);
    return {ok:true, save:"CW2_enc-0867-03-14-york_AFTER.ck3"};
  }
};
const api = () => (window.pywebview && window.pywebview.api) ? window.pywebview.api : MockBridge;

/* ---- event bus the Python side pushes into via evaluate_js ---- */
window.cw2 = { handlers:{}, on(t,f){(this.handlers[t]=this.handlers[t]||[]).push(f)},
  emit(t,p){(this.handlers[t]||[]).forEach(f=>f(p)); log(`${t} ${JSON.stringify(p)}`)} };

/* ---- state ---- */
const STEPS=[
  {id:"setup",   title:"Check setup"},
  {id:"enc",     title:"Review encounter"},
  {id:"roster",  title:"Roll armies"},
  {id:"battle",  title:"Fight in 3K"},
  {id:"return",  title:"Install save"}
];
const S={view:0, reached:0, sealed:false, busy:false, seed:867314,
  health:null, enc:null, roster:null, install:[], installed:false, launched:false, result:null, diff:null, error:null};

function log(msg){const el=document.getElementById("log");
  el.textContent+=`[${new Date().toLocaleTimeString("en-CA",{hour12:false})}] ${msg}\n`;el.scrollTop=el.scrollHeight;}

/* tally gap: 5 finished steps closes it; seal only after write-back */
function setTally(){
  const done=S.sealed?5:S.reached; const g=(5-done)*7;
  document.getElementById("halfL").style.transform=`translateX(${-g}px)`;
  document.getElementById("halfR").style.transform=`translateX(${g}px)`;
  document.getElementById("seal").classList.toggle("on",S.sealed);
  document.getElementById("stepline").innerHTML=S.sealed
    ? "<b>Sealed.</b> Result save installed."
    : `Step <b>${S.view+1}</b> of 5: ${STEPS[S.view].title}`;
}

function renderRail(){
  document.getElementById("rail").innerHTML=STEPS.map((s,i)=>{
    const state=i===S.view?"current":i>S.reached?"locked":"done";
    return `<li><button data-go="${i}" data-state="${state}" ${i>S.reached?"disabled":""}
      aria-current="${i===S.view?"step":"false"}"><span class="n">${i+1}</span>${s.title}</button></li>`;
  }).join("");
}

/* ---- screens ---- */
const V={
  setup(){
    const h=S.health;
    if(!h) return `<h2>Check setup</h2><p class="lede">Checking game paths and tools…</p>`;
    const allOk=h.paths.every(p=>p.ok);
    return `<h2>Check setup</h2>
    <p class="lede">CW2 needs both games, your CK3 save folder, and the RPFM command-line tool it uses to build and verify battle packs.</p>
    <div class="panel paths">${h.paths.map(p=>`
      <div class="pathrow"><span class="dot ${p.ok?"":"bad"}" aria-label="${p.ok?"Found":"Missing"}"></span>
        <span>${esc(p.label)}</span><code title="${esc(p.value)}">${esc(p.value)}</code>
        <button class="btn-quiet" data-action="browse" data-key="${p.key}">Change</button></div>`).join("")}
    </div>
    <div class="stack" style="margin-top:16px">
      ${h.ck3_running
        ? `<p class="notice">Crusader Kings III is running. That's fine for now; when you install the result, load the new save from the main menu instead of continuing this session.</p>`
        : `<p class="notice ok">Crusader Kings III is closed.</p>`}
    </div>
    <div class="actions">
      <button class="btn-primary" data-action="toEncounter" ${allOk?"":"disabled"}>Load encounter from save</button>
      <button class="btn-quiet" data-action="recheck">Check again</button>
    </div>`;
  },
  enc(){
    const e=S.enc; if(!e) return `<h2>Review encounter</h2><p class="lede">Reading the battle from ${esc("the latest CW2 export")}…</p>`;
    const [a,b]=e.sides, army=armyFor(e.sides), pa=a.men/(a.men+b.men)*100;
    const side=(s,n)=>`<section class="panel side" aria-label="${s.role}">
      <p class="role">${s.role}</p><h3>${esc(s.name)}</h3>
      <dl class="kv" style="margin-top:12px">
        <dt>Commander</dt><dd>${esc(s.commander.name)}, prowess ${s.commander.prowess}</dd>
        <dt>Knights</dt><dd>${s.knights.map(k=>`${esc(k.name)} ${k.prowess}`).join(", ")||"none"}</dd>
        <dt>Men</dt><dd>${fmt(s.men)}</dd>
        <dt>Levies</dt><dd>${fmt(s.levies)}</dd>
        <dt>Men-at-arms</dt><dd>${fmt(s.maa)}</dd>
        <dt>3K army</dt><dd><b>${n.generals}</b> generals + <b>${n.retinue}</b> units = ${n.cards} cards</dd>
      </dl></section>`;
    return `<h2>Battle of ${esc(e.location)}</h2>
    <p class="lede">${esc(e.date)} on ${esc(e.terrain.toLowerCase())}, from save <code>${esc(e.save)}</code>. The larger army gets the full ${MAX_GENERALS} generals and ${MAX_RETINUE} units; the smaller one is scaled by head count. Each general leads up to ${PER_GENERAL} units.</p>
    <div class="faceoff">${side(a,army[0])}<div class="vs" aria-hidden="true">vs</div>${side(b,army[1])}</div>
    <div class="ratio"><div class="bar" role="img" aria-label="Force ratio ${Math.round(pa)} to ${100-Math.round(pa)}">
      <div class="a" style="width:${pa}%"></div><div class="b" style="width:${100-pa}%"></div></div>
      <p>Force ratio ${Math.round(pa)} : ${100-Math.round(pa)} → ${army[0].cards} vs ${army[1].cards} unit cards in Three Kingdoms.</p></div>
    <div class="actions"><button class="btn-primary" data-action="toRoster">Roll armies</button></div>`;
  },
  roster(){
    const r=S.roster, e=S.enc; if(!r) return `<h2>Roll armies</h2><p class="lede">Rolling…</p>`;
    const stack=probs=>`<div class="stackbar" role="img" aria-label="${probs.map((p,k)=>`${TIER_NAMES[k]} ${Math.round(p*100)}%`).join(", ")}">
      ${probs.map((p,k)=>`<span class="t${k}" style="width:${(p*100).toFixed(1)}%"></span>`).join("")}</div>`;
    const col=(side,s)=>`<section class="panel"><h3 style="font-family:var(--display);font-weight:400;margin:0">${esc(side.name)}</h3>
      <p style="color:var(--bone-dim);margin:2px 0 8px">${s.generals.length} generals + ${s.retinue} units = ${s.cards} cards</p>
      ${s.generals.map(g=>`<div class="general">
        <p class="gname"><b>${esc(g.name)}</b> <span>${g.role}, prowess ${g.prowess}, leads ${g.retinue}</span></p>
        ${stack(g.probs)}
        <table><tbody>${g.units.map(u=>`<tr><td>${esc(u.name)}</td><td>${TIER_NAMES[u.tier]}</td><td class="num">${u.count}</td></tr>`).join("")}</tbody></table>
      </div>`).join("")}</section>`;
    const legend=`<p class="legend">${TIER_NAMES.map((t,k)=>`<span><i class="t${k}"></i>${t}</span>`).join("")}<span>Bar = chance of each tier for that general's picks</span></p>`;
    const prog=S.install.length?`<ul class="progress">${S.install.map(x=>`<li data-s="${x.status}"><span class="dot"></span>${esc(x.label)}</li>`).join("")}</ul>`:"";
    return `<h2>Roll armies</h2>
    <p class="lede">Picks are random but reproducible: the same seed always gives the same armies, so a bug report only needs the seed.</p>
    <div class="seedrow" style="margin-bottom:16px"><label for="seed">Seed</label>
      <input id="seed" inputmode="numeric" value="${r.seed}" ${S.installed?"disabled":""}>
      <button class="btn-quiet" data-action="reroll" ${S.installed||S.busy?"disabled":""}>Roll again</button></div>
    ${legend}<div class="cols">${col(e.sides[0],r.sides[0])}${col(e.sides[1],r.sides[1])}</div>
    ${prog}
    <div class="actions">
      ${S.installed
        ? `<button class="btn-primary" data-action="toBattle">Continue to battle</button>`
        : `<button class="btn-primary" data-action="install" ${S.busy?"disabled":""}>Prepare and install</button>`}
    </div>`;
  },
  battle(){
    const r=S.result;
    const SRC={engine_callback:"engine callback",routing_state:"routing state",victory_countdown_fallback:"victory countdown (fallback, lower confidence)"};
    const res=r?`<p class="notice ${r.player_outcome==="victory"?"ok":""}" style="margin-top:20px">${esc(S.enc.sides[r.player_side].name)}: ${r.player_outcome==="victory"?"victory":"not a victory (loss, draw or withdrawal)"}. Read from the ${esc(SRC[r.source]||r.source)}.</p>
    <div class="panel" style="margin-top:12px"><table>
      <thead><tr><th>Side</th><th class="num">3K men</th><th class="num">3K lost</th><th class="num">Loss share</th><th class="num">CK3 men</th><th class="num">CK3 lost</th></tr></thead>
      <tbody>${r.sides.map((s,i)=>`<tr><td>${esc(S.enc.sides[i].name)}${r.player_side===i?" (you)":""}</td>
        <td class="num">${fmt(s.tk_men)}</td><td class="num">${fmt(s.tk_lost)}</td>
        <td class="num">${(s.tk_lost/s.tk_men*100).toFixed(1)}%</td>
        <td class="num">${fmt(s.ck3_men)}</td><td class="num">${fmt(s.ck3_lost)}</td></tr>`).join("")}</tbody></table>
      <p class="formula">CK3 lost = CK3 men × (3K lost ÷ 3K men)</p></div>`:"";
    return `<h2>Fight in Three Kingdoms</h2>
    <p class="lede">${S.launched
      ? "Three Kingdoms is running with the CW2 battle pack. Fight the battle, let the results screen appear, then come back here."
      : "The battle pack is installed. Launch Three Kingdoms and start the battle from the custom battle screen."}</p>
    <div class="actions">
      ${S.launched?"":`<button class="btn-primary" data-action="launch">Launch Three Kingdoms</button>`}
      ${S.launched&&!r?`<button class="btn-primary" data-action="readResult" ${S.busy?"disabled":""}>Read battle result</button>`:""}
      ${r?`<button class="btn-primary" data-action="toReturn">Review changes</button>`:""}
    </div>${res}`;
  },
  return(){
    const d=S.diff; if(!d) return `<h2>Install save</h2><p class="lede">Working out the changes…</p>`;
    const running=S.health&&S.health.ck3_running;
    return `<h2>Install the result save</h2>
    <p class="lede">CW2 never edits your save. It writes a new one with only the changes below and puts it in your CK3 save folder.</p>
    <div class="panel"><table class="diff"><thead><tr><th>Save field</th><th class="num">Before</th><th class="num">After</th></tr></thead>
      <tbody>${d.changes.map(c=>`<tr><td>${esc(c.path)}</td><td class="num before">${fmt(c.before)}</td><td class="num after">${fmt(c.after)}</td></tr>`).join("")}</tbody></table>
      <dl class="kv" style="margin-top:14px;font-size:.9rem">
        <dt>From</dt><dd><code>${esc(d.input_save)}</code> (unchanged, sha256 ${esc(d.input_sha256)})</dd>
        <dt>New save</dt><dd><code>${esc(d.output_save)}</code></dd></dl></div>
    ${S.error?`<p class="notice" style="margin-top:16px">${S.error}</p>`:""}
    ${running&&!S.sealed?`<p class="notice" style="margin-top:16px">Crusader Kings III is running. Installing is safe, but don't keep playing that session: quit to the main menu and load the new save.</p>`:""}
    ${S.sealed?`<p class="notice ok" style="margin-top:16px">Installed. In Crusader Kings III, load <code>${esc(d.output_save.replace(/\.ck3$/,""))}</code> to continue your campaign.</p>`:""}
    <div class="actions">
      ${S.sealed?`<button class="btn-quiet" data-action="restart">Start a new battle</button>`
        :`<button class="btn-primary" data-action="apply" ${S.busy?"disabled":""}>Install save to CK3</button>`}
    </div>`;
  }
};

function render(){
  renderRail(); setTally();
  document.getElementById("main").innerHTML=V[STEPS[S.view].id]();
}
function go(i){S.view=i; S.reached=Math.max(S.reached,i); S.error=null; render(); document.getElementById("main").focus();}

/* ---- actions ---- */
window.cw2.on("install",p=>{S.install[p.index]={label:p.label,status:p.status}; if(STEPS[S.view].id==="roster") render();});

const A={
  async recheck(){S.health=await api().get_health(); log(`health ok=${S.health.paths.every(p=>p.ok)} ck3_running=${S.health.ck3_running}`); render();},
  async browse(el){log(`browse requested for ${el.dataset.key} (native file dialog in Python)`);},
  async toEncounter(){go(1); S.enc=await api().get_encounter(); log(`encounter ${S.enc.id}`); render();},
  async toRoster(){go(2); S.roster=await api().roll_roster(S.enc,S.seed); log(`rolled seed=${S.seed}`); render();},
  async reroll(){const v=parseInt(document.getElementById("seed").value,10);
    S.seed=Number.isFinite(v)?v:Math.floor(Math.random()*1e9); if(S.seed===S.roster.seed&&v===S.roster.seed)S.seed=Math.floor(Math.random()*1e9);
    S.roster=await api().roll_roster(S.enc,S.seed); log(`rolled seed=${S.seed}`); render();},
  async install(){S.busy=true;S.install=[];render();
    const r=await api().prepare_and_install(S.roster); S.busy=false; S.installed=true; log(`installed ${r.pack} sha256=${r.sha256}`); render();},
  async toBattle(){go(3);},
  async launch(){const r=await api().launch_3k(); S.launched=true; log(`3K launched pid=${r.pid}`); render();},
  async readResult(){S.busy=true;render(); S.result=await api().read_result(); S.busy=false; log(`result outcome=${S.result.player_outcome} source=${S.result.source}`); render();},
  async toReturn(){go(4); S.health=await api().get_health(); S.diff=await api().preview_changes(); render();},
  async apply(){S.busy=true;S.error=null;render();
    try{const r=await api().install_save(); S.sealed=true; log(`installed ${r.save}`);}
    catch(e){S.error=e.message==="exists"
      ? "A save with that name is already in your CK3 save folder, so nothing was written. CW2 never overwrites saves; roll a new battle or rename the old save."
      : `Install failed and nothing was written to your save folder: ${esc(e.message)}`; log(`install error ${e.message}`);}
    S.busy=false; render();},
  async restart(){Object.assign(S,{view:0,reached:0,sealed:false,roster:null,enc:null,install:[],installed:false,launched:false,result:null,diff:null}); await A.recheck();}
};

document.addEventListener("click",async ev=>{
  const g=ev.target.closest("[data-go]"); if(g&&!g.disabled){go(+g.dataset.go);return;}
  const b=ev.target.closest("[data-action]"); if(b&&!b.disabled&&A[b.dataset.action]) await A[b.dataset.action](b);
});
document.getElementById("simCk3").addEventListener("change",()=>A.recheck());

log("mockup booted (MockBridge). In the app, pywebview.api replaces it.");
render(); A.recheck();
</script>
</body>
</html>
